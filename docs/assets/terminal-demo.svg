<svg xmlns="http://www.w3.org/2000/svg" width="960" height="575" viewBox="0 0 960 575" role="img" aria-label="Terminal session showing real jev CLI outputs: an allow, a protected-path block, and a frontier route">
  <!-- page background -->
  <rect x="0" y="0" width="960" height="575" fill="#ffffff"/>

  <!-- terminal window -->
  <rect x="20" y="20" width="920" height="505" rx="10" fill="#1a1b1e" stroke="#33363c" stroke-width="1"/>
  <path d="M 20,58 H 940" stroke="#33363c" stroke-width="1"/>

  <!-- traffic lights -->
  <circle cx="46" cy="39" r="6" fill="#ff5f57"/>
  <circle cx="66" cy="39" r="6" fill="#febc2e"/>
  <circle cx="86" cy="39" r="6" fill="#28c840"/>
  <text x="480" y="43" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#8b949e">jev &#8212; node dist/src/cli.js</text>

  <!-- session lines -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#c9d1d9" xml:space="preserve">
    <!-- block 1: allow -->
    <text x="48" y="92"><tspan fill="#8b949e">$</tspan> <tspan fill="#e6edf3">jev check --diff examples/merge-gate/sample.diff --tests-passed</tspan></text>
    <text x="48" y="113">outcome: <tspan fill="#3fb950" font-weight="600">allow</tspan></text>
    <text x="48" y="134">source:  judge</text>
    <text x="48" y="155">reason:  mock: no risk signals</text>
    <text x="48" y="176">judge:   allow 0.85 &#8212; mock: no risk signals</text>

    <!-- block 2: block -->
    <text x="48" y="218"><tspan fill="#8b949e">$</tspan> <tspan fill="#e6edf3">jev check --diff examples/merge-gate/sample-risky.diff --tests-passed</tspan></text>
    <text x="48" y="239">outcome: <tspan fill="#f85149" font-weight="600">block</tspan></text>
    <text x="48" y="260">source:  rule (protected-paths)</text>
    <text x="48" y="281">reason:  protected path requires human review: src/payments/charge.ts</text>

    <!-- block 3: route -->
    <text x="48" y="323"><tspan fill="#8b949e">$</tspan> <tspan fill="#e6edf3">jev route --explain "migrate the payments schema to the new</tspan></text>
    <text x="48" y="344"><tspan fill="#e6edf3">provider, keep old invoices"</tspan></text>
    <text x="48" y="365">tier:          <tspan fill="#d29922" font-weight="600">frontier</tspan></text>
    <text x="48" y="386">abstained:     false</text>
    <text x="48" y="407">difficulty:    0.550</text>
    <text x="48" y="428">consequence:   1.000</text>
    <text x="48" y="449">signals:</text>
    <text x="48" y="470">  - money (+0.65) money/billing surface ("payments")</text>
    <text x="48" y="491">  - cross-domain (+0.55) spans db + payment</text>
    <text x="48" y="512">  - migration/irreversible (+0.5) migration or irreversible change ("migrate")</text>
  </g>

  <!-- caption -->
  <text x="24" y="558" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#6e7781">Captured from the built CLI (npm run build &#8594; node dist/src/cli.js). Exit codes: allow 0 &#183; block 2 &#183; human 3 &#183; usage/IO error 1.</text>
</svg>
